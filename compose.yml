---
volumes:
  postgres_data:
  django_media:
  django_static:


networks:
  otterball_network:

x-logging: &default-logging
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: '3'


x-shared-env: &shared-environment
  ENV: ${ENV:-production}
  DATABASE_URL: ${DATABASE_URL}
  REDIS_URL: ${REDIS_URL}
  CELERY_BROKER_URL: ${CELERY_BROKER_URL}
  CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND}
  DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN}
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
  ALLOWED_HOSTS: ${ALLOWED_HOSTS:-*}
  # The bot builds absolute links to the public pages from this, and Django
  # trusts it as a CSRF origin - a proxy that terminates TLS speaks http to
  # gunicorn, so without it every admin login through the proxy is a 403.
  PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-}
  CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-}
  TZ: ${TZ:-Europe/Berlin}
  # Read by docker-entrypoint.sh, which remaps appuser to these before dropping
  # privileges - so files written into the media volume belong to the host user.
  PUID: ${PUID:-8888}
  PGID: ${PGID:-8888}
  WEB_PORT: ${WEB_PORT:-8000}


services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    <<: *default-logging
    volumes: [postgres_data:/var/lib/postgresql]
    mem_limit: 1g
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret_password}
      POSTGRES_DB: ${POSTGRES_DB:-otterball_db}
      TZ: ${TZ:-Europe/Berlin}
    ports: ['${POSTGRES_PORT:-5432}:5432']
    networks: [otterball_network]
    healthcheck:
      test: [CMD, pg_isready, -U, postgres]
      interval: 5s
      timeout: 5s
      retries: 5


  valkey:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    <<: *default-logging
    environment: ['TZ=${TZ:-Europe/Berlin}']
    # No maxmemory: this is the Celery broker as well as the cache, and an
    # eviction here silently drops queued tasks. The cap is the backstop.
    mem_limit: 256m
    networks: [otterball_network]
    healthcheck:
      test: [CMD, valkey-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 5


  web:
    build: .
    restart: unless-stopped
    <<: *default-logging
    environment:
      <<: *shared-environment
    # ensure_schedule runs here rather than in `beat` because it needs the
    # django_celery_beat tables, and this is the container that migrates.
    command: sh -c "uv run python manage.py migrate && uv run python manage.py ensure_schedule
      && uv run python manage.py collectstatic --noinput && uv run gunicorn otterball_v2.wsgi:application
      --bind 0.0.0.0:$${WEB_PORT:-8000}"
    volumes: [django_media:/app/media, django_static:/app/static]
    # A cap turns a runaway container into one restart instead of an OOM that
    # takes the whole host with it. Raise if a service is killed under load;
    # `docker stats` shows what each one actually uses.
    mem_limit: 512m
    # WEB_BIND is the host address the port is published on: 0.0.0.0 for every
    # IPv4 address (the default), 127.0.0.1 to keep it behind a local proxy,
    # `::` for IPv6 - Docker binds that one v6-only, so serving both stacks
    # means publishing twice. See the Readme's production sample.
    ports: ['${WEB_BIND:-0.0.0.0}:${WEB_PORT:-8000}:${WEB_PORT:-8000}']
    depends_on:
      db:
        condition: service_healthy
      valkey:
        condition: service_healthy
    networks: [otterball_network]
    healthcheck:
      test: [CMD-SHELL, 'curl -f http://127.0.0.1:$${WEB_PORT:-8000}/health/']
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s


  bot:
    build: .
    restart: unless-stopped
    <<: *default-logging
    environment:
      <<: *shared-environment
    command: uv run python manage.py runbot
    # EmojiSyncCog reads team crests off disk (team.logo.open) to upload them
    # as application emoji, so the bot needs the media volume too - without it
    # every registration fails into its own except-Exception and logs a line.
    volumes: [django_media:/app/media]
    mem_limit: 512m
    depends_on:
      db:
        condition: service_healthy
      valkey:
        condition: service_healthy
      # `web` is the container that runs migrate, and on a fresh database beat
      # dies on django_celery_beat's missing tables while the worker's catch-up
      # finds no PredictionPool. Both recover on the next restart; waiting for
      # the migration to land means neither has to.
      web:
        condition: service_healthy
    networks: [otterball_network]
    healthcheck:
      test: [CMD-SHELL, test $$(find /tmp/bot_heartbeat -mmin -2)]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s


  worker:
    build: .
    restart: unless-stopped
    <<: *default-logging
    environment:
      <<: *shared-environment
    # 2, not the default one-per-core: these tasks wait on HTTP, they do not
    # compute, and every prefork child is a full Django process.
    command: uv run celery -A otterball_v2 worker --loglevel=info --concurrency=${CELERY_CONCURRENCY:-2}
    volumes: [django_media:/app/media]
    mem_limit: 768m
    depends_on:
      db:
        condition: service_healthy
      valkey:
        condition: service_healthy
      # `web` is the container that runs migrate, and on a fresh database beat
      # dies on django_celery_beat's missing tables while the worker's catch-up
      # finds no PredictionPool. Both recover on the next restart; waiting for
      # the migration to land means neither has to.
      web:
        condition: service_healthy
    networks: [otterball_network]
    healthcheck:
      test:
        - CMD-SHELL
        - uv run celery -A otterball_v2 inspect ping -d celery@$$HOSTNAME
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s


  beat:
    build: .
    restart: unless-stopped
    <<: *default-logging
    environment:
      <<: *shared-environment
    command: uv run celery -A otterball_v2 beat --loglevel=info
    mem_limit: 384m
    depends_on:
      db:
        condition: service_healthy
      valkey:
        condition: service_healthy
      # `web` is the container that runs migrate, and on a fresh database beat
      # dies on django_celery_beat's missing tables while the worker's catch-up
      # finds no PredictionPool. Both recover on the next restart; waiting for
      # the migration to land means neither has to.
      web:
        condition: service_healthy
    networks: [otterball_network]
    healthcheck:
      # `[c]elery` (the bracket trick), not 'celery beat': the process is
      # `celery -A otterball_v2 beat`, so the old pattern never matched and beat
      # reported unhealthy while scheduling perfectly. The brackets keep the
      # healthcheck's own shell - whose command line contains this pattern -
      # from matching itself, which is how a pgrep -f version passes even when
      # beat is dead.
      test: [CMD-SHELL, "ps aux | grep -q '[c]elery -A otterball_v2 beat'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
